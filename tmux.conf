set -s escape-time 0

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",*:RGB"

unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

set -g status-style 'bg=colour232 fg=colour250'
set -g status-left "#[bg=colour232,fg=colour255,bold] #S #[bg=colour232,fg=colour108]"
set -g status-left-length 30
set -g window-status-current-style 'bg=colour22,fg=colour255,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'bg=colour232,fg=colour245'
set -g window-status-format ' #I:#W '
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour108'
set -g message-style 'bg=colour22,fg=colour255,bold'
set -g message-command-style 'bg=colour52,fg=colour255,bold'

set -g status-right '#[fg=colour108]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null) #[fg=yellow]#(cd #{pane_current_path} && git status --porcelain 2>/dev/null | wc -l | sed "s/^0$//;s/^\\([1-9]\\)/±\\1/") #[fg=colour250]| %H:%M '

set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g display-time 2000
set -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g monitor-activity off
set -g monitor-bell off
set -g window-status-activity-style 'none'
set -g window-status-bell-style 'none'
set -g set-clipboard on
set -g detach-on-destroy off

set-option -g default-shell "$SHELL"
set-option -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS"

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; fi'
# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# selecionar panes sem prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Trocar janela com as setinhas
bind -n M-Right next-window
bind -n M-Left previous-window
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

bind-key -n MouseDown1StatusLeft choose-tree -Zs

# d → detach
bind D detach-client

# w → window list
bind W choose-window

# f → find text
bind F copy-mode \; send-keys /

# Horizontal pane - Ctrl+a " (default behavior)
bind '"' split-window -v

bind d choose-tree -Zs

# Vertical pane - Ctrl+a v (your request)
bind a split-window -h
bind v split-window -h -c "#{pane_current_path}"

# Leader + w: kill current pane with confirmation
bind w confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Leader + b: split horizontally (new pane at bottom)
bind b split-window -v -c "#{pane_current_path}"

bind X kill-session
bind K confirm-before -p "Close ALL? (y/n)" kill-server
bind S run-shell 'n=1; while tmux has-session -t "w$n" 2>/dev/null; do n=$((n+1)); done; tmux new-session -d -s "w$n" -c "#{pane_current_path}"; tmux switch-client -t "w$n"'

bind -T copy-mode-vi MouseDragEnd1Pane send-keys
unbind -T copy-mode-vi MouseDragEnd1Pane
# ===== FUZZY FINDER PARA PROJETOS/PASTAS =====

# f - Buscar projetos/pastas e abrir na janela atual (Ctrl+a f)
bind f display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ ~/Documents ~/projetos ~/dev ~/workspace \
    -maxdepth 5 -type d \
    \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .pyenv -o -path '*/.local/state'\
       -o -name .cache -o -name .npm -o -name .cargo -o -name .rustup -o -name .nvm -o -path '*/.local/share' \
    \\) -prune -o -print 2>/dev/null \
    | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Projects and files' \
    --prompt='󰍉  Search > '); \
  if [ -n \"\$selected\" ]; then \
    tmux rename-window \"\$(basename \"\$selected\")\"; \
    tmux send-keys \"cd \\\"\$selected\\\"\" C-m C-l; \
  fi"

# o - Abrir pasta em nova janela E renomear a janela
bind i display-popup -h 70% -w 85% -E "\
  selected=\$(find ~/ \
    -maxdepth 5 -type d \
    \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .pyenv -o -path '*/.local/state' \
       -o -name .cache -o -name .npm -o -name .cargo -o -name .rustup -o -name .nvm -o -path '*/.local/share' \
    \\) -prune -o -print 2>/dev/null \
    | fzf --reverse --height 100% \
    --preview='ls -la {}' \
    --header='󰝰  Open in another TAB'); \
  if [ -n \"\$selected\" ]; then \
    window_name=\$(basename \"\$selected\"); \
    tmux new-window -c \"\$selected\" -n \"\$window_name\"; \
  fi"

bind / command-prompt -p "Google:" \
  "run-shell 'xdg-open \"https://www.google.com/search?q=%%\" >/dev/null 2>&1 &'"

# IA
bind i display-popup -h 70% -w 80% -E "~/.local/bin/tmux-ai"

bind -n M-e new-window -c "#{pane_current_path}" -n "Files" "file=\$(find . \\( -type d \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .venv -o -name venv -o -name __pycache__ -o -name .npm -o -name .nvm -o -name .cache -o -name .pyenv -o -name .copilot -o -name go -o -name snap -o -path './.local/share' -o -path './.local/state' \\) -prune \\) -o -type f -print 2>/dev/null | fzf --layout=reverse --prompt='Files > '); if [ -n \"\$file\" ]; then tmux rename-window \"\$(basename \"\$file\")\"; nano  -m \"\$file\"; fi"

bind -n M-E new-window -c '#{pane_current_path}' -n "Search" "result=\$(grep -rniI --color=never --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=.venv --exclude-dir=venv --exclude-dir=env --exclude-dir=__pycache__ . 2>/dev/null | fzf --delimiter=: --layout=reverse --prompt='Search > '); if [ -n \"\$result\" ]; then file=\${result%%:*}; rest=\${result#*:}; line=\${rest%%:*}; tmux rename-window \"\$(basename \"\$file\")\"; nano +\"\$line\" \"\$file\"; fi"

# bind e new-window -c "#{pane_current_path}" -n "Files" "file=\$(find . \\( -type d \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .venv -o -name venv -o -name __pycache__ -o -name .npm -o -name .nvm -o -name .cache -o -name .pyenv -o -name .copilot -o -name go -o -name snap -o -path './.local/share' -o -path './.local/state' \\) -prune \\) -o -type f -print 2>/dev/null | fzf --layout=reverse --prompt='Files > '); if [ -n \"\$file\" ]; then tmux rename-window \"\$(basename \"\$file\")\"; nano  -m \"\$file\"; fi"
# 
# bind E new-window -c '#{pane_current_path}' -n "Search" "result=\$(grep -rniI --color=never --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=.venv --exclude-dir=venv --exclude-dir=env --exclude-dir=__pycache__ . 2>/dev/null | fzf --delimiter=: --layout=reverse --prompt='Search > '); if [ -n \"\$result\" ]; then file=\${result%%:*}; rest=\${result#*:}; line=\${rest%%:*}; tmux rename-window \"\$(basename \"\$file\")\"; nano +\"\$line\" \"\$file\"; fi"

# Search text inside files
bind -n M-O send-keys -R "old_name=\$(tmux display-message -p '#W'); result=\$(grep -rniI --color=never --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=.venv --exclude-dir=venv --exclude-dir=env --exclude-dir=__pycache__ . 2>/dev/null | fzf --delimiter=: --layout=reverse --prompt='Search > '); if [ -n \"\$result\" ]; then file=\${result%%:*}; rest=\${result#*:}; line=\${rest%%:*}; tmux rename-window \"\$(basename \"\$file\")\"; nano +\"\$line\" \"\$file\"; tmux rename-window \"\$old_name\"; fi" Enter

# Find files
bind -n M-o send-keys -R "old_name=\$(tmux display-message -p '#W'); file=\$(find . -type d \\( -name .git -o -name node_modules -o -name dist -o -name build -o -name .venv -o -name venv -o -name __pycache__ \\) -prune -o -type f -print 2>/dev/null | fzf --layout=reverse --prompt='Files > '); if [ -n \"\$file\" ]; then tmux rename-window \"\$(basename \"\$file\")\"; nano \"\$file\"; tmux rename-window \"\$old_name\"; fi" Enter

# Terminal popup persistente
bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% \
    "tmux new-session -A -s terminal"

#testes

# Reinicia o processo da window atual (Ctrl+C, seta pra cima, Enter)
bind R send-keys C-c \; send-keys Up Enter

# Reinicia uma window específica da sessão atual sem ir até ela
bind-key C-r command-prompt -p "Reiniciar window:" \
  "send-keys -t '%%' C-c ; send-keys -t '%%' Up Enter"

bind X confirm-before -p "Kill sessão #S? (y/n)" kill-session
bind B run-shell "~/run.sh"   # reroda seu script (ele já é idempotente)

# prefix + N: cadastrar novo projeto (popup interativo)
bind N display-popup -E -w 70% -h 70% "~/project.sh"

# prefix + L: listar projetos cadastrados (opcional)
bind L display-popup -E -w 70% -h 70% "bash -c '~/project.sh list; read -rsn1 -p \"Press any key...\"'"

# prefix + R: remover projeto cadastrado
bind R display-popup -E -w 50% -h 50% "~/project.sh rm"

#bind T new-window -n relogio "python3 ~/.local/bin/relogio --speed 0.08"
bind T send-keys -R "python3 ~/.local/bin/relogio --speed 0.08" C-m

